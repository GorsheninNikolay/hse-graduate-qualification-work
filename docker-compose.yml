services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./examples/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  framework:
    build: .
    image: framework:phase0
    ports:
      - "4000:4000"
    environment:
      POSTGRES_DSN: postgresql://postgres:postgres@postgres:5432/postgres
      REDIS_URL: redis://redis:6379/0
      SCHEMA_PATH: /app/examples/schema.graphql
      DSL_PATH: ${DSL_PATH:-/app/examples/graphql-api-no-cache.yaml}
    volumes:
      - ./examples:/app/examples:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  locust:
    image: framework:phase0
    command: ["sleep", "infinity"]
    # No depends_on: locust idles via sleep infinity and is invoked from the
    # host by Phase 3+ (Q4); the experiment workflow needs to stop+rm framework
    # without taking locust down too, so the dependency edge is dropped.

volumes:
  postgres_data:
