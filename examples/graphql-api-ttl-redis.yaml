# cell: invalidation=ttl, backend=redis.
# Mirror of examples/graphql-api-no-cache.yaml + cacheProfiles/cacheRules + invalidates blocks.

version: 1

sidecar:
  listen:
    loopback: "0.0.0.0:4000"
  boot:
    postgres_timeout: 30s

dataSources:
  postgres:
    type: postgres
    dsn: "${env.POSTGRES_DSN}"
    tables:
      User:
        table: users
        primaryKey: id
        columns:
          id: id
          name: full_name
          teamId: team_id
      Team:
        table: teams
        primaryKey: id
        columns:
          id: id
          name: name

queries:
  getUser:
    type: User
    source: postgres
    multiplicity: one
    where: "id = ${args.id}"
  listUsersByTeam:
    type: User
    source: postgres
    multiplicity: many
    where: "teamId = ${args.teamId}"
  getTeam:
    type: Team
    source: postgres
    multiplicity: one
    where: "id = ${args.id}"

cacheProfiles:
  hot:
    backend: redis
    eviction: lru
    ttl_seconds: 60
    invalidation:
      double_delete_delay_ms: 0
  list:
    backend: redis
    eviction: lru
    ttl_seconds: 30
    invalidation:
      double_delete_delay_ms: 0
  team:
    backend: redis
    eviction: lru
    ttl_seconds: 300
    invalidation:
      double_delete_delay_ms: 0

cacheRules:
  getUser:
    operations: [getUser]
    profile: hot
  listUsersByTeam:
    operations: [listUsersByTeam]
    profile: list
  getTeam:
    operations: [getTeam]
    profile: team

mutations:
  updateUserName:
    type: User
    source: postgres
    kind: update
    set:
      name: "${args.name}"
    where: "id = ${args.id}"
    invalidates:
      strategy: ttl
  moveUserToTeam:
    type: User
    source: postgres
    kind: update
    set:
      teamId: "${args.newTeamId}"
    where: "id = ${args.id}"
    invalidates:
      strategy: ttl
